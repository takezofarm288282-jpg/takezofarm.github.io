        }

        }

        }

        }

        }

        .main-content {

        }

        }

        .search-section h2 {

            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .skill-checkbox {
            display: flex;
            align-items: center;
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e0e0e0;
        }

        .skill-checkbox:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .skill-checkbox.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .skill-checkbox input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .skill-checkbox label {
            cursor: pointer;
            font-size: 0.95em;
            color: #333;
            flex: 1;
        }

        .skill-checkbox input[type="checkbox"]:checked + label {
            font-weight: bold;
            color: #667eea;
        }

        .search-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-mode {
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .search-mode label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95em;
        }

        .search-mode input[type="radio"] {
            margin-right: 5px;
            accent-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #dc3545;
        }

        .btn-clear:hover {
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }

            margin-top: 30px;
        }

            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;

            font-size: 1.8em;
        }

            padding: 8px 20px;

            align-items: center;

        }

            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;

        .skill-count {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

            margin-bottom: 20px;

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .stats-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {

                align-items: flex-start;

        // CSVをパース
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            skillsList = headers.slice(2); // 最初の2列（社名、氏名）を除く
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length < 3) continue; // 不完全な行をスキップ
                
                const craftsman = {
                    company: values[0] || '未設定',
                    name: values[1] || '名前未設定',
                    skills: {}
                };
                
                // 会社名を追加
                if (craftsman.company && craftsman.company !== '未設定') {
                    companiesSet.add(craftsman.company);
                }
                
                for (let j = 2; j < headers.length && j < values.length; j++) {
                    craftsman.skills[headers[j]] = values[j] === '1';
                }
                
                // 名前がある職人のみ追加
                if (craftsman.name && craftsman.name !== '名前未設定') {
                    craftsmenData.push(craftsman);
                }
            }
            
            // 統計を更新
            document.getElementById('totalCraftsmen').textContent = craftsmenData.length;
            document.getElementById('totalSkills').textContent = skillsList.length;
            document.getElementById('totalCompanies').textContent = companiesSet.size;
        }

        // スキルチェックボックスを生成
        function renderSkillCheckboxes() {
            const skillsGrid = document.getElementById('skillsGrid');
            skillsGrid.innerHTML = '';
            
            skillsList.forEach(skill => {
                const div = document.createElement('div');
                div.className = 'skill-checkbox';
                const checkboxId = `skill-${skill.replace(/[^a-zA-Z0-9]/g, '_')}`;
                div.innerHTML = `
                    <input type="checkbox" id="${checkboxId}" value="${skill}">
                    <label for="${checkboxId}">${skill}</label>
                `;
                
                // チェックボックスの変更イベント
                const checkbox = div.querySelector('input');
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        div.classList.add('selected');
                    } else {
                        div.classList.remove('selected');
                    }
                });
                
                skillsGrid.appendChild(div);
            });
        }

        // 職人を検索
        function searchCraftsmen() {
            const checkedSkills = [];
            document.querySelectorAll('#skillsGrid input[type="checkbox"]:checked').forEach(checkbox => {
                checkedSkills.push(checkbox.value);
            });

            if (checkedSkills.length === 0) {
                alert('作業内容を選択してください');
                return;
            }

            const searchMode = document.querySelector('input[name="searchMode"]:checked').value;
            const results = craftsmenData.filter(craftsman => {
                if (searchMode === 'OR') {
                    // いずれかの作業ができる
                    return checkedSkills.some(skill => craftsman.skills[skill]);
                } else {
                    // すべての作業ができる
                    return checkedSkills.every(skill => craftsman.skills[skill]);
                }
            });

            displayResults(results, checkedSkills);
        }

        // 検索結果を表示
        function displayResults(results, searchedSkills) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsCount = document.getElementById('resultsCount');
            const craftsmenGrid = document.getElementById('craftsmenGrid');

            resultsSection.style.display = 'block';
            resultsCount.textContent = `${results.length}人`;

            if (results.length === 0) {
                craftsmenGrid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>該当する職人が見つかりませんでした</h3>
                        <p>検索条件を変更してお試しください</p>
                    </div>
                `;
                return;
            }

            craftsmenGrid.innerHTML = '';
            results.forEach(craftsman => {
                const card = document.createElement('div');
                card.className = 'craftsman-card';
                
                // 職人が持っているスキルを抽出
                const possessedSkills = Object.keys(craftsman.skills).filter(skill => craftsman.skills[skill]);
                
                card.innerHTML = `
                    <div class="craftsman-header">
                        <div class="craftsman-name">${craftsman.name}</div>
                        <div class="craftsman-company">🏢 ${craftsman.company}</div>
                    </div>
                    <div class="craftsman-skills">
                        ${possessedSkills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                    </div>
                    <div class="skill-count">${possessedSkills.length}件の資格・作業</div>
                `;
                
                craftsmenGrid.appendChild(card);
            });

            // 結果までスクロール
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 選択をクリア
        function clearSelection() {
            document.querySelectorAll('#skillsGrid input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                checkbox.parentElement.classList.remove('selected');
            });
            document.getElementById('resultsSection').style.display = 'none';
        }

        // 初期化
        parseCSV(csvData);
        renderSkillCheckboxes();
    </script>
